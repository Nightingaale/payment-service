databaseChangeLog:
  - changeSet:
      id: 002-create-refund-transaction
      author: Nightingaale
      changes:
        - createTable:
            tableName: refunds_transaction
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true

              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: refund_transaction_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: refunded_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: refund_status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: error_message
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: masked_details
                  type: VARCHAR(19)
                  constraints:
                    nullable: false
                    updatable: false