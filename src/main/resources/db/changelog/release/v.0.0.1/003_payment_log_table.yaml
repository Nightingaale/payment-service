databaseChangeLog:
  - changeSet:
      id: 003-create-payments-log
      author: Nightingaale
      changes:
        - createTable:
            tableName: payments_log
            columns:
              - column:
                  name: log_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true

              - column:
                  name: payment_transaction_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: refund_transaction_id
                  type: uuid
                  constraints:
                    nullable: true

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: true

              - column:
                  name: provider
                  type: VARCHAR(50)
                  constraints:
                    nullable: true

              - column:
                  name: method_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: payments_log
            baseColumnNames: payment_transaction_id
            referencedTableName: payments_transaction
            referencedColumnNames: id
            constraintName: fk_payments_log_payment_transaction

        - addForeignKeyConstraint:
            baseTableName: payments_log
            baseColumnNames: refund_transaction_id
            referencedTableName: refunds_transaction
            referencedColumnNames: id
            constraintName: fk_payments_log_refund_transaction
